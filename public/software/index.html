<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software | Tazik</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js" defer></script>
<style>
  main {
    max-width: 640px;
    height: 100dvh;
    margin: 0 auto;
    padding: 3rem 1.5rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #term {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
</style>
</head>
<body>
<main>
<header>
<a class="home" href="/" aria-label="home"><span class="signature"></span></a>
<h1>Software</h1>
</header>
<div id="term"></div>
</main>
<script type="module">
import { loadLM } from './lm.js';

const tokens = getComputedStyle(document.documentElement);
const token = (name) => tokens.getPropertyValue(name).trim();
const term = new Terminal({
  cursorBlink: true,
  fontSize: 14,
  lineHeight: 1.5,
  fontFamily: '"SF Mono", Menlo, monospace',
  theme: {
    background: token('--bg'),
    foreground: token('--ink'),
    cursor: token('--accent'),
    selectionBackground: token('--muted'),
    brightBlack: token('--muted'),
  },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.loadAddon(new WebLinksAddon.WebLinksAddon());
term.open(document.getElementById('term'));
fit.fit();
let fitQueued = false;
addEventListener('resize', () => {
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => { fitQueued = false; fit.fit(); });
});
term.focus();

const write = (s) => term.write(s.replace(/\n/g, '\r\n'));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const PROGRAMS = [{
  name: 'transformer.sh',
  command: './transformer.sh',
  desc: 'language model (22.7M parameters)',
  url: 'https://github.com/taziksh/assignment1-basics',
}];
let mode = 'shell';
let line = '';
let busy = false;
let interrupted = false;
let lm = null;

const prompt = () => { term.write(mode === 'shell' ? '$ ' : '> '); line = ''; };

function ls() {
  term.write(PROGRAMS.map((p) => p.name).join('  ') + '\r\n');
}

function help() {
  const rows = [
    ['ls', 'list directory contents'],
    ['man [name]', 'an interface to the reference manuals'],
    ...PROGRAMS.map((p) => [p.command, p.desc]),
  ];
  const w = Math.max(...rows.map(([c]) => c.length)) + 3;
  for (const [c, d] of rows) term.write(c.padEnd(w) + d + '\r\n');
}

function man(arg) {
  if (!arg) { term.write("What manual page do you want?\r\nFor example, try 'man man'.\r\n"); return; }
  if (arg === 'man') { term.write('man - an interface to the system reference manuals\r\n'); return; }
  const p = PROGRAMS.find((x) => x.name === arg.replace(/^\.\//, ''));
  if (!p) { term.write(`No manual entry for ${arg}\r\n`); return; }
  const hdr = `${p.name.toUpperCase()}(1)`;
  const cols = term.cols;
  const mid = 'User Commands';
  const pad = Math.max(1, Math.floor((cols - hdr.length * 2 - mid.length) / 2));
  term.write(hdr + ' '.repeat(pad) + mid + ' '.repeat(pad) + hdr + '\r\n\r\n');
  term.write('\x1b[1mNAME\x1b[0m\r\n');
  term.write(`       ${p.name} - ${p.desc}\r\n\r\n`);
  term.write('\x1b[1mSYNOPSIS\x1b[0m\r\n');
  term.write(`       ${p.command}\r\n\r\n`);
  term.write('\x1b[1mSEE ALSO\x1b[0m\r\n');
  term.write(`       ${p.url}\r\n`);
}

async function startStories(program) {
  if (!lm) {
    busy = true;
    term.write('loading · 39 MB');
    try {
      lm = await loadLM();
    } catch (e) {
      term.write('\r\x1b[Kfailed to load\r\n');
      console.error(e);
      return;
    } finally {
      busy = false;
    }
    term.write('\r\x1b[K');
  }
  mode = 'story';
}

async function generate() {
  busy = true;
  interrupted = false;
  const p = line.trim() || 'Once upon a time';
  term.write('\r\n\r\n');
  write(p);
  let prev = '';
  try {
    const res = await lm.generate(p, {
      onToken: (id, genText) => {
        if (interrupted) throw new Error('interrupted');
        write(genText.slice(prev.length));
        prev = genText;
      },
    });
    if (res) console.log('[term] done', res.tps.toFixed(1), 'tok/s');
  } catch (e) {
    if (e.message !== 'interrupted') console.error(e);
  } finally {
    term.write('\r\n\r\n');
    busy = false;
    document.body.dataset.done = '1';
  }
}

const history = [];
let histIdx = -1;

function setLine(next) {
  term.write('\r\x1b[K' + (mode === 'shell' ? '$ ' : '> ') + next);
  line = next;
}

async function onEnter() {
  const cmd = line.trim();
  if (cmd) { history.push(cmd); }
  histIdx = -1;
  if (mode === 'story') { await generate(); prompt(); return; }
  term.write('\r\n');
  if (cmd === '') { prompt(); return; }
  if (cmd === 'ls') { ls(); prompt(); return; }
  if (cmd === 'help') { help(); prompt(); return; }
  if (cmd.split(/\s+/)[0] === 'man') { man(cmd.split(/\s+/)[1]); prompt(); return; }
  if (cmd === 'clear') { term.clear(); prompt(); return; }
  const name = cmd.replace(/^\.\//, '');
  const program = PROGRAMS.find((p) => p.name === name);
  if (program) { await startStories(program); prompt(); return; }
  term.write(`bash: ${cmd.split(/\s+/)[0]}: command not found\r\n`);
  prompt();
}

term.attachCustomKeyEventHandler((e) => {
  if (e.type === 'keydown' && e.metaKey && e.key === 'Backspace') {
    if (!busy) setLine('');
    return false;
  }
  return true;
});

term.onData((d) => {
  if (d === '\x03') {
    if (busy) { interrupted = true; return; }
    term.write('^C\r\n');
    if (mode === 'story') mode = 'shell';
    prompt();
    return;
  }
  if (busy) return;
  if (d === '\r') { onEnter(); return; }
  if (d === '\x7f') {
    if (line.length) { line = line.slice(0, -1); term.write('\b \b'); }
    return;
  }
  if (d === '\x1b[A' || d === '\x1b[B') {
    if (!history.length) return;
    if (d === '\x1b[A') {
      histIdx = histIdx < 0 ? history.length - 1 : Math.max(0, histIdx - 1);
      setLine(history[histIdx]);
    } else if (histIdx >= 0) {
      histIdx += 1;
      if (histIdx >= history.length) { histIdx = -1; setLine(''); }
      else setLine(history[histIdx]);
    }
    return;
  }
  if (d === '\x15') { setLine(''); return; }
  if (d === '\x17' || d === '\x1b\x7f') {
    setLine(line.replace(/\S+\s*$/, ''));
    return;
  }
  if (d === '\x0c') {
    term.clear();
    setLine(line);
    return;
  }
  if (d === '\t') {
    if (mode !== 'shell') return;
    const names = PROGRAMS.map((p) => p.name);
    const commands = PROGRAMS.flatMap((p) => [p.name, p.command]);
    let pool = [...commands, 'ls', 'man', 'clear', 'help'];
    let head = '';
    if (line.startsWith('man ')) { pool = names; head = line.slice(4); }
    else head = line;
    const hits = pool.filter((c) => c.startsWith(head));
    if (!hits.length) return;
    let lcp = hits[0];
    for (const h of hits) { while (!h.startsWith(lcp)) lcp = lcp.slice(0, -1); }
    if (lcp.length > head.length) {
      term.write(lcp.slice(head.length));
      line = line.slice(0, line.length - head.length) + lcp;
    } else if (hits.length > 1) {
      term.write('\r\n' + hits.join('  '));
      setLine(line);
    }
    return;
  }
  if (d >= ' ') { line += d; term.write(d); }
});

async function autotype(cmd, fn) {
  term.write('$ ');
  await sleep(500);
  for (const c of cmd) { term.write(c); await sleep(140); }
  await sleep(300);
  term.write('\r\n');
  fn();
}

async function boot() {
  busy = true;
  await autotype('ls', ls);
  busy = false;
  prompt();
  document.body.dataset.ready = '1';
}
await boot();

if (new URLSearchParams(location.search).has('auto')) {
  line = './transformer.sh';
  await onEnter();
  line = '';
  await onEnter();
}
</script>
</body>
</html>
